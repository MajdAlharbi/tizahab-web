{% extends "dashboard_base.html" %}
{% load static %}

{% block title %}Map | Tizahab{% endblock %}

{% block head %}
<style>
  #mapPageMap {
    height: calc(100vh - 180px);
    min-height: 420px;
  }

  .map-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    height: calc(100vh - 180px);
    min-height: 420px;
    background: #ffffff;
    color: #6b7280;
    font-size: 14px;
    font-weight: 500;
  }

  .map-spinner {
    width: 22px;
    height: 22px;
    border: 3px solid #e5e7eb;
    border-top-color: #7e1ca1;
    border-radius: 9999px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .gm-style .gm-style-iw-c {
    padding: 0 !important;
    border-radius: 16px !important;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12) !important;
  }

  .gm-style .gm-style-iw-d {
    overflow: hidden !important;
    padding: 0 !important;
  }
</style>
{% endblock %}

{% block content %}
<div class="flex flex-col h-full px-4 lg:px-6 py-4 gap-4">

  <div class="flex items-center justify-between shrink-0">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">
        <span class="nav-label-en">Explore Map</span>
        <span class="nav-label-ar hidden">استكشاف الخريطة</span>
      </h1>
      <p class="text-sm text-gray-500 mt-0.5">
        <span class="nav-label-en">Discover places across Riyadh</span>
        <span class="nav-label-ar hidden">اكتشف الأماكن في الرياض</span>
      </p>
    </div>
    
  </div>
<div class="flex-1 rounded-2xl border border-gray-200 shadow-sm overflow-hidden relative"
    style="min-height: 420px;">
<div id="mapPageMap" class="w-full h-full" style="min-height: 420px;"></div>
</div>

</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/map.js' %}"></script>
<script>
  let mapPageMapInstance = null;

  async function loadMapPageMarkers() {
    if (!mapPageMapInstance || !window.google || !google.maps) return;

    const events = [];
    let nextUrl = "/api/events/";

    while (nextUrl) {
      const data = await apiGet(nextUrl);
      const pageEvents = Array.isArray(data) ? data : data.results || [];
      events.push(...pageEvents);
      nextUrl = Array.isArray(data) ? null : data.next || null;
    }

    const info = new google.maps.InfoWindow();
    const bounds = new google.maps.LatLngBounds();

    events
      .filter((event) => Number.isFinite(Number.parseFloat(event?.latitude)) && Number.isFinite(Number.parseFloat(event?.longitude)))
      .forEach((event) => {
        const position = {
          lat: Number.parseFloat(event.latitude),
          lng: Number.parseFloat(event.longitude),
        };

        const marker = new google.maps.Marker({
          position,
          map: mapPageMapInstance,
          title: event.title,
        });

        marker.addListener("click", () => {
          info.setContent(
            `<div style="font-weight:600;margin-bottom:4px;">${String(event.title || "").replaceAll("<", "&lt;").replaceAll(">", "&gt;")}</div>` +
            `<div style="font-size:12px;opacity:.85;">${String(event.location || "").replaceAll("<", "&lt;").replaceAll(">", "&gt;")}</div>`,
          );
          info.open({ anchor: marker, map: mapPageMapInstance });
        });

        bounds.extend(position);
      });

    if (!bounds.isEmpty()) {
      mapPageMapInstance.fitBounds(bounds);
    }
  }

  function initMapPage() {
    if (!window.TZMap) return;
    mapPageMapInstance = window.TZMap.initMap("mapPageMap", { zoom: 12 });
    loadMapPageMarkers().catch((error) => console.error("Failed to load map markers", error));
  }
</script>
<script
  src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&callback=initMapPage"
  async
  defer></script>
{% endblock %}
