{% extends "dashboard_base.html" %}
{% load static %}

{% block title %}Map | Tizahab{% endblock %}

{% block head %}
<style>
  /* Make the map fill the available vertical space */
  #mapPageMap { height: calc(100vh - 180px); min-height: 400px; }
</style>
{% endblock %}

{% block content %}
<div class="flex flex-col h-full px-4 lg:px-6 py-4 gap-4">

  <!-- Header row -->
  <div class="flex items-center justify-between shrink-0">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Explore Map</h1>
      <p class="text-sm text-gray-500 mt-0.5">Discover places across Riyadh</p>
    </div>
    <span id="mapPlaceCount" class="text-sm text-gray-400"></span>
  </div>

  <!-- Search + Filter bar -->
  <div class="flex flex-wrap items-center gap-3 shrink-0">
    <div class="relative flex-1 min-w-[200px] max-w-sm">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
      <input id="mapSearch" type="text" placeholder="Search places…"
        class="w-full h-10 rounded-xl border border-gray-200 pl-9 pr-4 text-sm focus:outline-none focus:border-brand bg-white transition">
    </div>

    <!-- Category pills -->
    <div class="flex gap-2 flex-wrap">
      <button class="map-filter h-9 px-4 rounded-full border bg-brand text-white border-brand text-xs font-medium" data-cat="">All</button>
      <button class="map-filter h-9 px-4 rounded-full border bg-white text-gray-700 text-xs font-medium hover:bg-gray-50" data-cat="food">🍽️ Food</button>
      <button class="map-filter h-9 px-4 rounded-full border bg-white text-gray-700 text-xs font-medium hover:bg-gray-50" data-cat="culture">🏛️ Culture</button>
      <button class="map-filter h-9 px-4 rounded-full border bg-white text-gray-700 text-xs font-medium hover:bg-gray-50" data-cat="outdoor">🌿 Outdoor</button>
      <button class="map-filter h-9 px-4 rounded-full border bg-white text-gray-700 text-xs font-medium hover:bg-gray-50" data-cat="shopping">🛍️ Shopping</button>
    </div>
  </div>

  <!-- Map container -->
  <div class="flex-1 bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
    <div id="mapPageMap" class="w-full"></div>
  </div>

</div>

<script src="{% static 'js/map.js' %}"></script>
<script>
  let _allMapEvents = [];
  let _mapInstance = null;
  let _markers = [];
  let _infoWindow = null;
  let _currentCat = "";
  let _currentSearch = "";
  let _debounce = null;

  function escHtml(s) {
    return String(s || "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
  }

  function initMapPage() {
    if (!window.TZMap) return;
    _mapInstance = window.TZMap.initMap("mapPageMap", { zoom: 11 });
    if (!_mapInstance) return;
    _infoWindow = new google.maps.InfoWindow();
    loadMapEvents();
  }

  function renderMarkers(events) {
    if (!_mapInstance || !window.google) return;
    _markers.forEach(m => m.setMap(null));
    _markers = [];
    const bounds = new google.maps.LatLngBounds();
    let hasPoints = false;

    events.forEach(ev => {
      if (typeof ev.latitude !== "number" || typeof ev.longitude !== "number") return;
      const pos = { lat: ev.latitude, lng: ev.longitude };
      const marker = new google.maps.Marker({ position: pos, map: _mapInstance });
      _markers.push(marker);
      bounds.extend(pos);
      hasPoints = true;

      marker.addListener("click", () => {
        const price = ev.price ? `${parseFloat(ev.price).toFixed(0)} SAR` : "Free";
        _infoWindow.setContent(`
          <div style="min-width:180px;font-family:Arial,sans-serif">
            <div style="font-weight:600;font-size:14px;margin-bottom:4px">${escHtml(ev.title)}</div>
            <div style="font-size:12px;color:#6b7280;margin-bottom:4px">📍 ${escHtml(ev.location || "Riyadh")}</div>
            <div style="font-size:12px;color:#7e1ca1;font-weight:600;margin-bottom:6px">${escHtml(price)}</div>
            <a href="/events/page/${ev.id}/" style="font-size:12px;color:#7e1ca1;text-decoration:none;font-weight:600">View Details →</a>
          </div>
        `);
        _infoWindow.open({ anchor: marker, map: _mapInstance });
      });
    });

    if (hasPoints) _mapInstance.fitBounds(bounds);
    document.getElementById("mapPlaceCount").textContent = `${events.length} place${events.length !== 1 ? "s" : ""}`;
  }

  function applyFilters() {
    let filtered = _allMapEvents;
    if (_currentCat) filtered = filtered.filter(e => e.category === _currentCat);
    if (_currentSearch) {
      const q = _currentSearch.toLowerCase();
      filtered = filtered.filter(e =>
        (e.title || "").toLowerCase().includes(q) ||
        (e.location || "").toLowerCase().includes(q)
      );
    }
    renderMarkers(filtered);
  }

  async function loadMapEvents() {
    const token = localStorage.getItem("access");
    if (!token) { window.location.href = "/login/"; return; }
    try {
      const res = await fetch("/api/events/", { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 401) { localStorage.removeItem("access"); window.location.href = "/login/"; return; }
      if (!res.ok) return;
      const data = await res.json();
      _allMapEvents = Array.isArray(data) ? data : (data.results || []);
      applyFilters();
    } catch { /* silent */ }
  }

  // Category filters
  document.querySelectorAll(".map-filter").forEach(btn => {
    btn.addEventListener("click", () => {
      _currentCat = _currentCat === btn.dataset.cat ? "" : btn.dataset.cat;
      document.querySelectorAll(".map-filter").forEach(b => {
        const active = b.dataset.cat === _currentCat;
        b.classList.toggle("bg-brand", active);
        b.classList.toggle("text-white", active);
        b.classList.toggle("border-brand", active);
        b.classList.toggle("bg-white", !active);
        b.classList.toggle("text-gray-700", !active);
      });
      applyFilters();
    });
  });

  // Search
  document.getElementById("mapSearch").addEventListener("input", e => {
    _currentSearch = e.target.value.trim();
    clearTimeout(_debounce);
    _debounce = setTimeout(applyFilters, 300);
  });
</script>

<script
  src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&callback=initMapPage"
  async defer>
</script>
{% endblock %}
