{% extends "dashboard_base.html" %}
{% load static %}

{% block title %}Home | Tizahab{% endblock %}

{% block content %}

<div class="max-w-[700px] mx-auto px-4 py-10 sm:py-14 space-y-10">

  <!-- ── 1. Hero ── -->
  <header class="text-center space-y-3">
    <h1 id="heroGreeting"
      class="text-3xl sm:text-4xl font-bold text-gray-900"
      style="font-family:'Cantata One',serif">
      Welcome to Riyadh
    </h1>

    <div class="flex flex-wrap items-center justify-center gap-2 text-sm text-gray-500">
      <span id="tripDateRange" class="hidden"></span>
      <span id="tripDateSep" class="hidden text-gray-300">·</span>
      <span id="dayCounterBadge"
        class="hidden inline-flex items-center gap-1 bg-violet-50 text-violet-700 font-semibold text-xs px-3 py-1 rounded-full">
        <span id="dayCounterText"></span>
      </span>
    </div>
  </header>

  <!-- ── 2. Daily Plan Card ── -->
  <div id="planCard">
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-8 text-center">
      <p class="text-sm text-gray-300">Loading your journey…</p>
    </div>
  </div>

  <!-- ── 3. Quick Navigation ── -->
  <section>
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest text-center mb-5">Explore</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">

      <a href="/events/page/"
        class="group flex flex-col items-center gap-2.5 bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:border-violet-200 hover:shadow-md transition">
        <div class="w-10 h-10 rounded-xl bg-violet-50 flex items-center justify-center group-hover:bg-violet-100 transition">
          <i data-lucide="ticket" class="w-5 h-5 text-violet-600"></i>
        </div>
        <span class="text-sm font-medium text-gray-700">Events</span>
      </a>

      <a href="/map/"
        class="group flex flex-col items-center gap-2.5 bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:border-violet-200 hover:shadow-md transition">
        <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center group-hover:bg-blue-100 transition">
          <i data-lucide="map" class="w-5 h-5 text-blue-600"></i>
        </div>
        <span class="text-sm font-medium text-gray-700">Map</span>
      </a>

      <a href="/travel-guide/"
        class="group flex flex-col items-center gap-2.5 bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:border-violet-200 hover:shadow-md transition">
        <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center group-hover:bg-emerald-100 transition">
          <i data-lucide="compass" class="w-5 h-5 text-emerald-600"></i>
        </div>
        <span class="text-sm font-medium text-gray-700">Travel Guide</span>
      </a>

      <a href="/booking/"
        class="group flex flex-col items-center gap-2.5 bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:border-violet-200 hover:shadow-md transition">
        <div class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center group-hover:bg-amber-100 transition">
          <i data-lucide="bed" class="w-5 h-5 text-amber-600"></i>
        </div>
        <span class="text-sm font-medium text-gray-700">Hotel Booking</span>
      </a>

      <a href="{% url 'car_rental' %}"
        class="group flex flex-col items-center gap-2.5 bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:border-violet-200 hover:shadow-md transition">
        <div class="w-10 h-10 rounded-xl bg-rose-50 flex items-center justify-center group-hover:bg-rose-100 transition">
          <i data-lucide="car" class="w-5 h-5 text-rose-500"></i>
        </div>
        <span class="text-sm font-medium text-gray-700">Car Rental</span>
      </a>

      <a href="/profile/"
        class="group flex flex-col items-center gap-2.5 bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:border-violet-200 hover:shadow-md transition">
        <div class="w-10 h-10 rounded-xl bg-gray-50 flex items-center justify-center group-hover:bg-gray-100 transition">
          <i data-lucide="user" class="w-5 h-5 text-gray-500"></i>
        </div>
        <span class="text-sm font-medium text-gray-700">Profile</span>
      </a>

    </div>
  </section>

</div>

<script src="{% static 'js/home.js' %}"></script>
<script>
  // Hero personalisation — reads localStorage, never throws
  (function () {
    try {
      var startRaw = localStorage.getItem("tz_plan_start_date") || localStorage.getItem("tz_start_date");
      var endRaw   = localStorage.getItem("tz_plan_end_date")   || localStorage.getItem("tz_end_date");
      var userName = localStorage.getItem("user_name") || "";

      if (userName) {
        var el = document.getElementById("heroGreeting");
        if (el) el.textContent = "Welcome to Riyadh, " + userName;
      }

      var fmt = function (iso) {
        try { return new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
        catch (e) { return iso || ""; }
      };

      if (startRaw && endRaw) {
        var rangeEl = document.getElementById("tripDateRange");
        var sepEl   = document.getElementById("tripDateSep");
        if (rangeEl) {
          rangeEl.textContent = fmt(startRaw) + " – " + fmt(endRaw);
          rangeEl.classList.remove("hidden");
        }

        var today = new Date(); today.setHours(0, 0, 0, 0);
        var start = new Date(startRaw); start.setHours(0, 0, 0, 0);
        var end   = new Date(endRaw);   end.setHours(0, 0, 0, 0);
        var dayX  = Math.max(1, Math.floor((today - start) / 86400000) + 1);
        var dayY  = Math.max(1, Math.round((end   - start) / 86400000) + 1);

        if (dayX <= dayY) {
          var badge = document.getElementById("dayCounterBadge");
          var text  = document.getElementById("dayCounterText");
          if (badge && text) {
            text.textContent = "Day " + dayX + " of " + dayY;
            badge.classList.remove("hidden");
            if (sepEl) sepEl.classList.remove("hidden");
          }
        }
      }
    } catch (e) { /* localStorage unavailable — fail silently */ }
  })();
</script>

{% endblock %}
