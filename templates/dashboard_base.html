{% load static %}
<!DOCTYPE html>
<html lang="en" id="htmlRoot" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tizahab | تزهب{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#4D1B76',
            'brand-light': '#7E1CA1',
            background: '#F6F7FB'
          },
          fontFamily: {
            sans: ['Arimo', 'Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&family=Cairo:wght@400;600;700&display=swap"
    rel="stylesheet">

  <style>
    body {
      background-color: #F6F7FB;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

   
    .nav-item.active {
      background-color: rgba(255, 255, 255, 0.1);
      border-left: 4px solid white;
      font-weight: 700;
    }

    [dir="rtl"] .nav-item.active {
      border-left: none;
      border-right: 4px solid white;
    }
  </style>
</head>

<body class="flex h-screen overflow-hidden text-gray-800 antialiased">

  <div id="sidebarOverlay" class="hidden fixed inset-0 bg-gray-900/50 z-40 transition-opacity backdrop-blur-sm"></div>

  <aside id="sidebar"
    class="fixed inset-y-0 left-0 w-64 bg-brand text-white flex flex-col z-50 transform -translate-x-full transition-transform duration-300 shadow-2xl">

    <div class="h-20 flex items-center justify-between px-6 border-b border-white/10">
      <a href="/" class="flex flex-col">
        <span class="text-2xl font-bold tracking-wider">Tizahab</span>
        <span class="text-xs text-white/70 font-medium font-['Cairo']">تزهب</span>
      </a>
      <button id="closeSidebarBtn" class="text-white/70 hover:text-white">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>

    <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto no-scrollbar">

      <a href="/home"
        class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-colors text-white/90 hover:text-white">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-sm">Home</span>
      </a>

      <a href="/daily-plan"
        class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-colors text-white/90 hover:text-white">
        <i data-lucide="calendar-days" class="w-5 h-5"></i>
        <span class="text-sm">Daily Plan</span>
      </a>

      <a href="/events"
        class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-colors text-white/90 hover:text-white">
        <i data-lucide="ticket" class="w-5 h-5"></i>
        <span class="text-sm">Events</span>
      </a>

      <a href="/map"
        class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-colors text-white/90 hover:text-white">
        <i data-lucide="map-pin" class="w-5 h-5"></i>
        <span class="text-sm">Map</span>
      </a>

      <div class="pt-4 mt-4 border-t border-white/10"></div>

      <a href="/profile"
        class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-colors text-white/90 hover:text-white">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-sm">Profile</span>
      </a>

      <a href="/settings"
        class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-colors text-white/90 hover:text-white">
        <i data-lucide="settings" class="w-5 h-5"></i>
        <span class="text-sm">Settings</span>
      </a>
    </nav>

    <div class="p-4 border-t border-white/10">
      <a href="/logout"
        class="flex items-center gap-3 px-4 py-3 w-full text-red-300 rounded-lg hover:bg-red-500/10 transition-colors text-sm">
        <i data-lucide="log-out" class="w-5 h-5"></i>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <div class="flex-1 flex flex-col h-screen overflow-hidden">

    <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-4 lg:px-8 z-30">

      <div class="flex items-center gap-4 flex-1">
        <button id="mobileMenuBtn" class="p-2 text-gray-500 hover:text-brand rounded-lg">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

        <div class="relative w-full max-w-lg hidden sm:block">
          <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
          <input type="text" placeholder="Search destinations, events..."
            class="w-full bg-gray-50 border border-gray-200 rounded-xl h-11 pl-11 pr-4 text-sm focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
        </div>
      </div>

      <div class="flex items-center gap-3 sm:gap-5 ml-4">

        <button id="langBtn"
          class="flex items-center gap-2 px-3 h-10 rounded-xl hover:bg-gray-50 transition text-sm font-semibold text-gray-600">
          <i data-lucide="globe" class="w-4 h-4"></i>
          <span id="langLabel">EN</span>
        </button>

        <button class="relative p-2 rounded-xl text-gray-500 hover:bg-gray-50 transition-colors">
          <i data-lucide="bell" class="w-5 h-5"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>

        <div class="h-6 w-px bg-gray-200 hidden sm:block"></div>

        <a href="/profile"
          class="h-10 w-10 bg-gradient-to-tr from-brand to-brand-light text-white rounded-full flex items-center justify-center text-sm font-bold shadow-sm cursor-pointer hover:opacity-90 transition-all border-2 border-transparent hover:border-gray-200">
          AM
        </a>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth w-full relative">
      {% block content %}
      {% endblock %}
    </main>

  </div>

  <script>
    lucide.createIcons();

    // 1. Sidebar Toggle Logic
    const menuBtn = document.getElementById("mobileMenuBtn");
    const closeBtn = document.getElementById("closeSidebarBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");

    function toggleSidebar() {
      sidebar.classList.toggle("-translate-x-full");
      overlay.classList.toggle("hidden");
    }

    menuBtn?.addEventListener("click", toggleSidebar);
    closeBtn?.addEventListener("click", toggleSidebar);
    overlay?.addEventListener("click", toggleSidebar);

    // 2. Language Switcher Logic (EN/AR)
    const langBtn = document.getElementById("langBtn");
    const langLabel = document.getElementById("langLabel");
    const htmlRoot = document.getElementById("htmlRoot");

    let currentLang = localStorage.getItem("lang") || "EN";
    applyLanguage(currentLang);

    langBtn?.addEventListener("click", () => {
      currentLang = currentLang === "EN" ? "AR" : "EN";
      applyLanguage(currentLang);
    });

    function applyLanguage(lang) {
      langLabel.innerText = lang;
      if (lang === "AR") {
        htmlRoot.setAttribute("dir", "rtl");
        htmlRoot.setAttribute("lang", "ar");
        document.body.classList.add("font-['Cairo']");
      } else {
        htmlRoot.setAttribute("dir", "ltr");
        htmlRoot.setAttribute("lang", "en");
        document.body.classList.remove("font-['Cairo']");
      }
      localStorage.setItem("lang", lang);
    }

    // 3. Auto-Highlight Active Menu Item
    document.addEventListener("DOMContentLoaded", () => {
      const currentPath = window.location.pathname;
      document.querySelectorAll(".nav-item").forEach(item => {
        const link = item.getAttribute("href");
        if (currentPath.includes(link) && link !== "/") {
          item.classList.add("active");
        }
      });
    });
  </script>
</body>

</html>
