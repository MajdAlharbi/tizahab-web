{% extends "dashboard_base.html" %}
{% load static i18n %}

{% block title %}Event Details | Tizahab{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 lg:px-6 py-6">

  <!-- Back nav -->
  <div class="mb-6">
    <a href="/events/page/" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-brand transition">
      ← Back to Events
    </a>
  </div>

  <!-- Loading skeleton -->
  <div id="eventLoading" class="space-y-5">
    <div class="h-72 bg-white border rounded-2xl animate-pulse"></div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-3">
        <div class="h-32 bg-white border rounded-2xl animate-pulse"></div>
        <div class="h-10 bg-gray-100 rounded-xl animate-pulse"></div>
        <div class="h-40 bg-white border rounded-2xl animate-pulse"></div>
      </div>
      <div class="h-56 bg-white border rounded-2xl animate-pulse"></div>
    </div>
  </div>

  <!-- Populated by events.js renderEventDetails() -->
  <div id="eventDetails"></div>

</div>

<script>
  window.EVENT_ID = "{{ event_id }}";
  document.addEventListener("DOMContentLoaded", () => {
    const loading = document.getElementById("eventLoading");
    const details = document.getElementById("eventDetails");
    const observer = new MutationObserver(() => {
      if (details.children.length > 0) {
        loading.classList.add("hidden");
        observer.disconnect();
      }
    });
    observer.observe(details, { childList: true });
  });
</script>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/events.js' %}"></script>
{% endblock %}
