{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Details | Tizahab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: "#7E1CA1" } } } }
  </script>
</head>

<body class="bg-gray-50">
  <header class="bg-white border-b">
    <div class="max-w-[1100px] mx-auto px-6 h-16 flex items-center gap-3">
      <a href="/events/page/" class="text-sm text-gray-600 hover:underline">← Back to Events</a>
      <span class="text-gray-300">|</span>
      <h1 class="text-xl font-semibold text-gray-800">Event Details</h1>
    </div>
  </header>

  <main class="max-w-[1100px] mx-auto px-6 py-8">
    <!-- Loading state -->
    <div id="eventLoading" class="space-y-4">
      <div class="h-64 bg-white border rounded-2xl animate-pulse"></div>
      <div class="h-8 w-64 bg-gray-200 rounded animate-pulse"></div>
      <div class="h-4 w-96 bg-gray-100 rounded animate-pulse"></div>
    </div>

    <!-- Populated by events.js renderEventDetails() -->
    <div id="eventDetails"></div>
  </main>

  <script>
    window.EVENT_ID = "{{ event_id }}";
  </script>
  <script src="{% static 'js/events.js' %}"></script>
  <script>
    // Hide loading skeleton once JS renders the content
    document.addEventListener("DOMContentLoaded", () => {
      const loading = document.getElementById("eventLoading");
      const details = document.getElementById("eventDetails");

      // Poll briefly; renderEventDetails populates #eventDetails
      const observer = new MutationObserver(() => {
        if (details.children.length > 0) {
          loading.classList.add("hidden");
          observer.disconnect();
        }
      });
      observer.observe(details, { childList: true });
    });
  </script>
</body>
</html>
