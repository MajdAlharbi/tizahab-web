{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Reset Password | Tizahab</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Cantata+One&family=Bona+Nova+SC&display=swap"
rel="stylesheet">
</head>

<body class="min-h-screen flex items-center justify-center
bg-gradient-to-b from-[#D16CF5] via-[#7E1CA1] to-[#8034E0]
font-arimo relative">

<div class="w-[420px] bg-white/95 rounded-2xl shadow-2xl px-10 py-12">

<div class="text-center mb-8">
<img src="{% static 'images/logo.png' %}" class="mx-auto mb-3 h-10">
<h1 class="text-3xl text-[#7E1CA1] font-cantata">Tizahab</h1>
<p class="text-xl text-[#7E1CA1] font-bona">تــــــــزهب</p>
</div>

<h2 class="text-xl text-[#7E1CA1] font-bold mb-6">
Create a new password
</h2>

<form method="post" class="space-y-6">
{% csrf_token %}

<div>
<label class="block text-sm mb-2">New Password</label>

<input type="password"
name="password1"
placeholder="Enter your password"
required
class="w-full h-12 rounded-lg px-4 bg-[#F3F3F5]">
</div>

<div>
<label class="block text-sm mb-2">Confirm Password</label>

<input type="password"
name="password2"
placeholder="Retype password"
required
class="w-full h-12 rounded-lg px-4 bg-[#F3F3F5]">
</div>

<button type="submit"
class="w-full h-12 rounded-lg text-white text-lg font-bold
bg-gradient-to-b from-[#7E1CA1] to-[#8034E0]">
Reset Password
</button>

</form>

</div>

</body>
</html>
