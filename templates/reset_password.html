{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Tizahab</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&family=Cantata+One&family=Bona+Nova+SC&display=swap"
rel="stylesheet">
</head>

<body class="relative min-h-screen overflow-x-hidden bg-slate-50 font-[Arimo] text-slate-900">
<div class="pointer-events-none fixed inset-0 overflow-hidden">
  <div class="absolute -top-28 -right-20 h-72 w-72 rounded-full bg-violet-200/60 blur-3xl"></div>
  <div class="absolute top-1/3 -left-24 h-80 w-80 rounded-full bg-fuchsia-100/80 blur-3xl"></div>
  <div class="absolute bottom-0 right-1/4 h-56 w-56 rounded-full bg-amber-100/70 blur-3xl"></div>
</div>

<main class="relative z-10 flex min-h-screen items-center justify-center px-4 py-12">
  <div class="w-full max-w-[440px] rounded-3xl border border-white/70 bg-white/95 px-6 py-8 shadow-[0_24px_70px_rgba(88,28,135,0.14)] backdrop-blur sm:px-9 sm:py-10">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-violet-600 text-xl font-bold text-white shadow-lg shadow-violet-200">
        T
      </div>
      <h1 class="font-['Cantata_One'] text-3xl text-violet-800">Tizahab</h1>
      <p class="mt-1 font-['Bona_Nova_SC'] text-lg text-violet-500">تِزهب</p>
    </div>

    <h2 class="mb-6 text-xl font-bold text-violet-800">
      Create a new password
    </h2>

    {% if error %}
    <p class="mb-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-600">{{ error }}</p>
    {% endif %}

    <form method="post" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="mb-2 block text-sm font-semibold text-slate-700">New Password</label>
        <input type="password"
          name="password1"
          placeholder="Enter your password"
          required
          class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm text-slate-900 placeholder:text-slate-400 transition focus:border-violet-400 focus:bg-white focus:outline-none focus:ring-4 focus:ring-violet-100">
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold text-slate-700">Confirm Password</label>
        <input type="password"
          name="password2"
          placeholder="Retype password"
          required
          class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm text-slate-900 placeholder:text-slate-400 transition focus:border-violet-400 focus:bg-white focus:outline-none focus:ring-4 focus:ring-violet-100">
      </div>

      <button type="submit"
        class="h-12 w-full rounded-xl bg-gradient-to-r from-violet-700 to-violet-500 text-base font-bold text-white shadow-lg shadow-violet-200 transition hover:from-violet-800 hover:to-violet-600">
        Reset Password
      </button>
    </form>
  </div>
</main>

</body>
</html>
