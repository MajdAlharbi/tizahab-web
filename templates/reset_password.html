{% load static i18n %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Tizahab</title>

<script>
  (function () {
    try {
      var t = localStorage.getItem("tz_theme") || "light";
      var resolved = t === "auto"
        ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
        : t;
      document.documentElement.setAttribute("data-theme", resolved);
      document.documentElement.setAttribute("data-theme-mode", t);
    } catch (e) {}
  })();
</script>

<script src="https://cdn.tailwindcss.com"></script>

<link
href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&family=Cantata+One&family=Bona+Nova+SC&display=swap"
rel="stylesheet">

<style>
  .auth-shell { background: #f7f8fc; color: #172033; font-family: Arimo, sans-serif; }
  .auth-glow-violet { background: rgba(124, 58, 237, 0.12); }
  .auth-glow-warm { background: rgba(190, 170, 86, 0.10); }
  .auth-card {
    background: rgba(255, 255, 255, 0.94);
    border-color: rgba(255, 255, 255, 0.80);
    box-shadow: 0 24px 70px rgba(88, 28, 135, 0.10);
  }
  .auth-label { color: #334155; }
  .auth-input { background: #f8fafc; border-color: #e2e8f0; color: #172033; }
  .auth-input::placeholder { color: #94a3b8; }
  .auth-input:focus {
    background: #ffffff;
    border-color: #a78bfa;
    box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.20);
  }
  .auth-theme-btn[aria-pressed="true"] {
    background: #7c3aed;
    color: #ffffff;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.18);
  }
  .auth-theme-btn[aria-pressed="false"] { color: #64748b; }
  [data-theme="dark"] .auth-shell { background: #111827; color: #f8fafc; }
  [data-theme="dark"] .auth-glow-violet { background: rgba(139, 92, 246, 0.16); }
  [data-theme="dark"] .auth-glow-warm { background: rgba(190, 170, 86, 0.08); }
  [data-theme="dark"] .auth-card {
    background: rgba(24, 31, 45, 0.94);
    border-color: rgba(148, 163, 184, 0.16);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
  }
  [data-theme="dark"] .auth-label { color: #dbe4f0; }
  [data-theme="dark"] .auth-input {
    background: #0f172a;
    border-color: #334155;
    color: #f8fafc;
  }
  [data-theme="dark"] .auth-input::placeholder { color: #64748b; }
  [data-theme="dark"] .auth-input:focus {
    background: #111827;
    border-color: #a78bfa;
    box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.18);
  }
  [data-theme="dark"] .auth-soft {
    background: rgba(15, 23, 42, 0.72);
    border-color: rgba(148, 163, 184, 0.18);
  }
  [data-theme="dark"] .auth-theme-btn[aria-pressed="false"] { color: #cbd5e1; }
</style>
</head>

<body class="auth-shell relative min-h-screen overflow-x-hidden">
<div class="pointer-events-none fixed inset-0 overflow-hidden">
  <div class="auth-glow-violet absolute -top-32 -right-24 h-72 w-72 rounded-full blur-3xl"></div>
  <div class="auth-glow-violet absolute top-1/3 -left-28 h-72 w-72 rounded-full blur-3xl"></div>
  <div class="auth-glow-warm absolute bottom-0 right-1/4 h-56 w-56 rounded-full blur-3xl"></div>
</div>

<div class="absolute left-4 right-4 top-5 z-10 flex items-center justify-end gap-3">
  <div class="auth-soft flex rounded-full border border-slate-200 bg-white/80 p-1 text-xs font-semibold shadow-sm backdrop-blur">
    <button type="button" data-auth-theme="light" class="auth-theme-btn rounded-full px-3 py-1.5 transition" aria-pressed="false">Light</button>
    <button type="button" data-auth-theme="dark" class="auth-theme-btn rounded-full px-3 py-1.5 transition" aria-pressed="false">Dark</button>
    <button type="button" data-auth-theme="auto" class="auth-theme-btn rounded-full px-3 py-1.5 transition" aria-pressed="false">Auto</button>
  </div>
  <div class="auth-soft flex rounded-full border border-slate-200 bg-white/80 p-1 text-xs font-semibold shadow-sm backdrop-blur">
    <button type="button" data-lang="en" class="lang-btn rounded-full px-3 py-1.5 transition">EN</button>
    <button type="button" data-lang="ar" class="lang-btn rounded-full px-3 py-1.5 transition">ع</button>
  </div>
</div>

<main class="relative z-10 flex min-h-screen items-center justify-center px-4 py-20 sm:py-16">
  <div class="auth-card w-full max-w-[440px] rounded-3xl border px-6 py-8 backdrop-blur sm:px-9 sm:py-10">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-violet-600 text-xl font-bold text-white shadow-lg shadow-violet-200">
        T
      </div>
      <h1 class="font-['Cantata_One'] text-3xl text-violet-800">Tizahab</h1>
      <p class="mt-1 font-['Bona_Nova_SC'] text-lg text-violet-500">تِزهب</p>
    </div>

    <h2 class="mb-6 text-xl font-bold text-violet-800" data-i18n="resetTitle">
      Create a new password
    </h2>

    {% if error %}
    <p class="mb-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-600">{{ error }}</p>
    {% endif %}

    <form method="post" class="space-y-5">
      {% csrf_token %}

      <div>
        <label class="auth-label mb-2 block text-sm font-semibold" data-i18n="newPassword">New Password</label>
        <input type="password"
          name="password1"
          placeholder="Enter your password"
          data-i18n-placeholder="passwordPlaceholder"
          required
          class="auth-input h-12 w-full rounded-xl border px-4 text-sm transition focus:outline-none">
      </div>

      <div>
        <label class="auth-label mb-2 block text-sm font-semibold" data-i18n="confirmPassword">Confirm Password</label>
        <input type="password"
          name="password2"
          placeholder="Retype password"
          data-i18n-placeholder="retypePlaceholder"
          required
          class="auth-input h-12 w-full rounded-xl border px-4 text-sm transition focus:outline-none">
      </div>

      <button type="submit"
        class="h-12 w-full rounded-xl bg-gradient-to-r from-violet-700 to-violet-500 text-base font-bold text-white shadow-lg shadow-violet-200 transition hover:from-violet-800 hover:to-violet-600">
        <span data-i18n="resetPassword">Reset Password</span>
      </button>
    </form>
  </div>
</main>

<script>
  (function () {
    function resolveTheme(mode) {
      if (mode === "auto") {
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      return mode || "light";
    }

    function applyAuthTheme(mode) {
      var resolved = resolveTheme(mode);
      document.documentElement.setAttribute("data-theme", resolved);
      document.documentElement.setAttribute("data-theme-mode", mode);
      localStorage.setItem("tz_theme", mode);
      document.querySelectorAll("[data-auth-theme]").forEach(function (btn) {
        btn.setAttribute("aria-pressed", btn.getAttribute("data-auth-theme") === mode ? "true" : "false");
      });
    }

    var saved = localStorage.getItem("tz_theme") || "light";
    applyAuthTheme(saved);

    document.querySelectorAll("[data-auth-theme]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        applyAuthTheme(btn.getAttribute("data-auth-theme"));
      });
    });

    var media = window.matchMedia("(prefers-color-scheme: dark)");
    if (media.addEventListener) {
      media.addEventListener("change", function () {
        if ((localStorage.getItem("tz_theme") || "light") === "auto") {
          applyAuthTheme("auto");
        }
      });
    }
  })();
</script>
<script src="/static/js/auth_i18n.js"></script>
</body>
</html>
