<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Panel | Tizahab</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

  <div class="mx-auto max-w-7xl px-4 py-6 lg:px-6">
    <div class="space-y-6">

      <!-- HEADER -->
      <section class="rounded-3xl bg-slate-900 text-white p-6 flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold">Admin Dashboard</h1>
          <p class="text-sm text-slate-300">Manage events and users</p>
        </div>
        <button onclick="logout()" class="bg-white/10 px-4 py-2 rounded-xl hover:bg-white/20">
          Logout
        </button>
      </section>

      <!-- STATS -->
      <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl">
          <p>Events</p>
          <h2 id="stat-events">--</h2>
        </div>
        <div class="bg-white p-4 rounded-xl">
          <p>Users</p>
          <h2 id="stat-users">--</h2>
        </div>
        <div class="bg-white p-4 rounded-xl">
          <p>Free</p>
          <h2 id="stat-free">--</h2>
        </div>
        <div class="bg-white p-4 rounded-xl">
          <p>Categories</p>
          <h2 id="stat-categories">--</h2>
        </div>
      </section>

      <!-- EVENTS -->
      <section class="bg-white rounded-xl p-4">
        <div class="flex justify-between mb-3">
          <input id="adminSearch" placeholder="Search..." class="border p-2 rounded w-1/2" />
          <button id="refreshEvents" class="border px-3 rounded">Refresh</button>
        </div>

        <table class="w-full text-sm">
          <thead>
            <tr>
              <th>Event</th>
              <th>Category</th>
              <th>Location</th>
              <th>Price</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="adminEventsTable"></tbody>
        </table>
      </section>

      <!-- USERS -->
      <section class="bg-white rounded-xl p-4">
        <h2 class="font-bold mb-3">Users</h2>
        <table class="w-full text-sm">
          <thead>
            <tr>
              <th>Username</th>
              <th>Email</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="adminUsersTable"></tbody>
        </table>
      </section>

    </div>
  </div>

  <script>

    const EVENTS_API = "/api/events/admin/events/";
    const USERS_API = "/api/auth/admin/users/";

    let events = [];
    let users = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /* Auth: JWT stored in localStorage */

    function getToken() {
      return localStorage.getItem("access") || "";
    }

    function logout() {
      localStorage.removeItem("access");
      localStorage.removeItem("refresh");
      window.location.href = "/login/";
    }

    async function fetchWithAuth(url, options = {}) {
      const headers = {
        ...(options.headers || {}),
        "Authorization": `Bearer ${getToken()}`,
      };

      const res = await fetch(url, { ...options, headers });

      if (res.status === 401 || res.status === 403) {
        window.location.href = "/login/";
        return null;
      }

      if (!res.ok) {
        console.error(`[Admin] ${options.method || 'GET'} ${url} → ${res.status}`);
        return null;
      }

      return res;
    }

    /* ================= EVENTS ================= */

    async function loadEvents() {
      const res = await fetchWithAuth(EVENTS_API);
      if (!res) return;

      const data = await res.json();
      events = Array.isArray(data) ? data : (data.results || []);
      renderEvents();
      updateStats();
    }

    function renderEvents() {
      const table = document.getElementById("adminEventsTable");

      table.innerHTML = events.map(e => `
    <tr class="border-b hover:bg-slate-50">
      <td class="py-2">${escapeHtml(e.title)}</td>
      <td>${escapeHtml(e.category)}</td>
      <td>${escapeHtml(e.location)}</td>
      <td>${escapeHtml(e.price || "Free")}</td>
      <td class="space-x-2">
        <button onclick="editEvent(${e.id})" class="text-blue-600 hover:underline">Edit</button>
        <button onclick="deleteEvent(${e.id})" class="text-red-600 hover:underline">Delete</button>
      </td>
    </tr>
  `).join("");
    }

    async function deleteEvent(id) {
      if (!confirm("Delete this event?")) return;

      await fetchWithAuth(`${EVENTS_API}${id}/`, {
        method: "DELETE"
      });

      loadEvents();
    }

    async function editEvent(id) {
      const event = events.find(e => e.id === id);
      const title = prompt("New title", event?.title || "");
      if (title === null) return;

      await fetchWithAuth(`${EVENTS_API}${id}/`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title })
      });

      loadEvents();
    }

    /* ================= USERS ================= */

    async function loadUsers() {
      const res = await fetchWithAuth(USERS_API);
      if (!res) return;

      const data = await res.json();
      users = Array.isArray(data) ? data : (data.results || []);
      renderUsers();
      updateStats();
    }

    function renderUsers() {
      const table = document.getElementById("adminUsersTable");

      table.innerHTML = users.map(u => `
    <tr class="border-b hover:bg-slate-50">
      <td class="py-2">${escapeHtml(u.username)}</td>
      <td>${escapeHtml(u.email)}</td>
      <td class="space-x-2">
        <button onclick="deleteUser(${u.id})" class="text-red-600 hover:underline">Delete</button>
      </td>
    </tr>
  `).join("");
    }

    async function deleteUser(id) {
      if (!confirm("Delete this user?")) return;

      await fetchWithAuth(`${USERS_API}${id}/`, {
        method: "DELETE"
      });

      loadUsers();
    }

    /* ================= STATS ================= */

    function updateStats() {
      document.getElementById("stat-events").textContent = events.length;
      document.getElementById("stat-users").textContent = users.length;

      const free = events.filter(e => !e.price).length;
      document.getElementById("stat-free").textContent = free;

      const categories = new Set(events.map(e => e.category));
      document.getElementById("stat-categories").textContent = categories.size;
    }

    /* ================= SEARCH ================= */

    document.getElementById("adminSearch").addEventListener("input", (e) => {
      const value = e.target.value.toLowerCase();

      const filtered = events.filter(ev =>
        ev.title.toLowerCase().includes(value)
      );

      const table = document.getElementById("adminEventsTable");

      table.innerHTML = filtered.map(e => `
    <tr class="border-b">
      <td>${escapeHtml(e.title)}</td>
      <td>${escapeHtml(e.category)}</td>
      <td>${escapeHtml(e.location)}</td>
      <td>${escapeHtml(e.price || "Free")}</td>
      <td>
        <button onclick="editEvent(${e.id})">Edit</button>
        <button onclick="deleteEvent(${e.id})">Delete</button>
      </td>
    </tr>
  `).join("");
    });

    /* ================= INIT ================= */

    document.getElementById("refreshEvents").addEventListener("click", loadEvents);

    document.addEventListener("DOMContentLoaded", () => {
      if (!getToken()) {
        window.location.href = "/login/";
        return;
      }
      loadEvents();
      loadUsers();
    });

  </script>

</body>

</html>
